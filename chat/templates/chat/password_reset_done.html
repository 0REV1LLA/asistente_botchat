{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmaLuz | Correo Enviado</title>
    <link rel="icon" type="image/x-icon" href="{% static 'chat/img/favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'chat/css/login.css' %}">
</head>
<body>
    <main class="page-shell">
        <section class="login-card">
            <div class="brand-block">
                <div class="brand-logo">
                    <img src="{% static 'chat/img/farmaluz-logo.png' %}" alt="FarmaLuz">
                </div>
                <div>
                    <p class="eyebrow">FarmaLuz</p>
                    <h1><i class="fa-solid fa-envelope-circle-check" style="color: #22c55e;"></i> Correo Enviado</h1>
                    <p class="subtitle">Revisa tu bandeja de entrada para continuar.</p>
                </div>
            </div>

            <div class="success-box" role="status">
                <i class="fa-solid fa-check-circle" style="font-size: 2rem; color: #22c55e; display: block; margin-bottom: 10px;"></i>
                <p style="margin-bottom: 8px;">Hemos enviado las instrucciones para restablecer tu contraseña al correo que proporcionaste.</p>
                <p style="font-size: 0.9rem; color: #6b7280;">El enlace de recuperación es válido por 24 horas.</p>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a class="secondary-link" href="{% url 'chat:login' %}">
                    <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </section>
    </main>
</body>
</html>
