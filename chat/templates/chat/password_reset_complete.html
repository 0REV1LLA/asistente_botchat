{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmaLuz | ¡Cédula Actualizada!</title>
    <link rel="icon" type="image/x-icon" href="{% static 'chat/img/favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'chat/css/login.css' %}">
</head>
<body>
    <main class="page-shell">
        <section class="login-card">
            <div class="brand-block">
                <div class="brand-logo">
                    <img src="{% static 'chat/img/farmaluz-logo.png' %}" alt="FarmaLuz">
                </div>
                <div>
                    <p class="eyebrow">FarmaLuz</p>
                    <h1><i class="fa-solid fa-circle-check" style="color: #22c55e;"></i> ¡Cédula Actualizada!</h1>
                    <p class="subtitle">Tu acceso ha sido restablecido exitosamente.</p>
                </div>
            </div>

            <div class="success-box" role="status">
                <i class="fa-solid fa-party-horn" style="font-size: 3rem; color: #f59e0b; display: block; margin-bottom: 10px;"></i>
                <p style="margin-bottom: 8px;">Tu cédula ha sido cambiada exitosamente.</p>
                <p style="font-size: 0.9rem; color: #6b7280;">Ahora puedes iniciar sesión con tu nueva cédula.</p>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a class="submit-btn" href="{% url 'chat:login' %}" style="display: inline-block; text-decoration: none; text-align: center; padding: 12px 32px;">
                    <span>Ir al inicio de sesión</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
